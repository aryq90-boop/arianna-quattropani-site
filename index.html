<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arianna Quattropani</title>

  <meta
    name="description"
    content="Photographic works by Arianna Quattropani. Projects, exhibitions and publications."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ------------------------------------------------
       HEADER
    ------------------------------------------------ */

    .header {
      height: 90px;
      width: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;

      padding: 0 3vw;

      background: #fff;
    }


    /* HOME + PROJECTS */

    .nav-left {
      display: flex;
      align-items: center;
      gap: 48px;
    }


    /* SELECTED + ABOUT */

    .nav-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 54px;
    }


    /* NAME + INSTAGRAM */

    .nav-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }


    .nav-link {
      position: relative;

      font-size: 14px;
      font-weight: 600;

      letter-spacing: .04em;
      text-transform: uppercase;

      padding-bottom: 6px;
    }


    /* little line on hover */

    .nav-link::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 0;
      height: 1px;

      background: #000;

      transform: translateX(-50%);

      transition: width .2s ease;
    }


    .nav-link:hover::after {
      width: 22px;
    }


    .name {
      font-size: 15px;
      font-weight: 800;

      letter-spacing: .02em;

      text-transform: uppercase;
      white-space: nowrap;
    }


    .instagram {
      width: 18px;
      height: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .instagram svg {
      width: 18px;
      height: 18px;

      stroke: #000;
    }



    /* ------------------------------------------------
       MAIN HOMEPAGE
    ------------------------------------------------ */

    .home {
      min-height: calc(100vh - 90px);

      display: grid;

      grid-template-columns:
        minmax(0, 62%)
        minmax(280px, 38%);

      align-items: center;

      padding:
        4vh
        4vw
        6vh;

      gap: 5vw;
    }



    /* ------------------------------------------------
       IMAGE
    ------------------------------------------------ */

    .image-area {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .image-area img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 72vh;

      object-fit: contain;
    }



    /* ------------------------------------------------
       PROJECT TITLES
    ------------------------------------------------ */

    .projects {
      height: 60vh;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      gap: clamp(40px, 5vw, 90px);
    }


    .project-link {
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(22px, 2.3vw, 38px);
      font-weight: 400;

      letter-spacing: .03em;

      text-transform: uppercase;

      writing-mode: vertical-rl;
      transform: rotate(180deg);

      white-space: nowrap;

      transition: opacity .2s ease;
    }


    .project-link:hover {
      opacity: .45;
    }



    /* ------------------------------------------------
       TABLET
    ------------------------------------------------ */

    @media (max-width: 900px) {

      .header {
        grid-template-columns: auto 1fr auto;
        padding: 0 20px;
      }

      .nav-left {
        gap: 22px;
      }

      .nav-center {
        gap: 22px;
      }

      .nav-link {
        font-size: 12px;
      }

      .name {
        font-size: 12px;
      }


      .home {
        grid-template-columns: 60% 40%;

        padding:
          30px
          24px
          40px;

        gap: 30px;
      }


      .projects {
        gap: 28px;
      }

    }



    /* ------------------------------------------------
       MOBILE
    ------------------------------------------------ */

    @media (max-width: 650px) {

      .header {
        height: auto;

        display: flex;
        flex-wrap: wrap;

        padding: 20px;

        gap: 20px;
      }


      .nav-left {
        order: 1;
      }


      .nav-center {
        order: 2;

        margin-left: auto;
      }


      .nav-right {
        order: 3;

        width: 100%;

        justify-content: flex-start;
      }


      .home {
        display: block;

        padding:
          35px
          20px
          50px;
      }


      .image-area {
        width: 100%;

        margin-bottom: 45px;
      }


      .image-area img {
        max-height: none;
        width: 100%;
      }


      .projects {
        height: auto;

        align-items: flex-start;

        gap: 28px;
      }


      .project-link {
        height: 320px;

        font-size: 22px;
      }

    }

  </style>
</head>



<body>


  <!-- HEADER -->

  <header class="header">


    <nav class="nav-left">

      <a class="nav-link" href="/">
        Home
      </a>

      <a class="nav-link" href="#projects">
        Projects
      </a>

    </nav>



    <nav class="nav-center">

      <a class="nav-link" href="selected/">
        Selected
      </a>

      <a class="nav-link" href="about/">
        About
      </a>

    </nav>



    <div class="nav-right">

      <span class="name">
        Arianna Quattropani
      </span>


      <a
        class="instagram"
        href="#"
        aria-label="Instagram"
        target="_blank"
        rel="noopener"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
          ></rect>

          <circle
            cx="12"
            cy="12"
            r="4"
          ></circle>

          <circle
            cx="17.5"
            cy="6.5"
            r=".7"
            fill="#000"
            stroke="none"
          ></circle>

        </svg>

      </a>

    </div>


  </header>



  <!-- HOMEPAGE -->

  <main class="home">


    <!-- PHOTO LEFT -->

    <section class="image-area">

      <img
        src="assets/home-01.jpg"
        alt="Photography by Arianna Quattropani"
      >

    </section>



    <!-- PROJECTS RIGHT -->

    <nav
      class="projects"
      id="projects"
      aria-label="Projects"
    >


      <a
        class="project-link"
        href="project/residual-green/"
      >
        Residual Green
      </a>


      <a
        class="project-link"
        href="project/faraway-so-close/"
      >
        Faraway So Close
      </a>


      <a
        class="project-link"
        href="project/aremu/"
      >
        Aremu
      </a>


    </nav>


  </main>


</body>
</html>
