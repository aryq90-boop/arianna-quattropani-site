<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arianna Quattropani</title>

  <meta
    name="description"
    content="Photographic works by Arianna Quattropani. Projects, exhibitions and publications."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #000;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==================================================
       HEADER
    ================================================== */

    .site-header {
      width: 100%;
      height: 82px;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      align-items: center;

      padding: 0 3vw;

      background: #fff;
    }


    /* HOME + PROJECTS */

    .nav-left {
      display: flex;
      align-items: center;
      gap: 48px;
    }


    /* SELECTED + ABOUT */

    .nav-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 54px;
    }


    /* NAME + INSTAGRAM */

    .identity {
      display: flex;
      justify-content: flex-end;
      align-items: center;

      gap: 8px;
    }


    .menu-link {
      position: relative;

      padding: 8px 0;

      font-size: 14px;
      font-weight: 650;

      letter-spacing: 0.025em;

      text-transform: uppercase;
    }


    /* SMALL LINE ON HOVER */

    .menu-link::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 1px;

      width: 0;
      height: 1px;

      background: #000;

      transform: translateX(-50%);

      transition: width 0.18s ease;
    }

    .menu-link:hover::after {
      width: 23px;
    }


    .name {
      font-size: 15px;
      font-weight: 800;

      letter-spacing: 0.015em;

      text-transform: uppercase;

      white-space: nowrap;
    }


    .instagram {
      width: 17px;
      height: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-left: 2px;
    }

    .instagram svg {
      width: 17px;
      height: 17px;

      stroke: #000;
    }


    /* ==================================================
       HOMEPAGE
    ================================================== */

    .homepage {
      width: 100%;

      min-height: calc(100vh - 82px);

      display: grid;

      /*
        LARGE PHOTO LEFT
        PROJECT TITLES RIGHT
      */

      grid-template-columns:
        minmax(0, 61%)
        minmax(320px, 39%);

      align-items: center;

      gap: 4.5vw;

      /*
        Very little unused space:
        the composition fills almost
        the whole screen.
      */

      padding:
        2vh
        3vw
        3vh;
    }


    /* ==================================================
       PHOTO
    ================================================== */

    .photo-area {
      width: 100%;
      height: calc(100vh - 125px);

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    .photo-area img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      /*
        No forced crop.
        No forced zoom.
        Original proportions preserved.
      */
    }


    /* ==================================================
       PROJECT TITLES
    ================================================== */

    .projects {
      width: 100%;

      height: calc(100vh - 140px);

      display: flex;

      align-items: center;
      justify-content: center;

      gap: clamp(48px, 5vw, 96px);
    }


    .project-link {
      height: 90%;

      display: flex;

      align-items: center;
      justify-content: center;

      /*
        TOP → BOTTOM
      */

      writing-mode: vertical-rl;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: clamp(28px, 2.55vw, 43px);

      font-weight: 700;

      letter-spacing: 0.01em;

      text-transform: uppercase;

      white-space: nowrap;

      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }


    .project-link:hover {
      opacity: 0.42;
    }


    /* ==================================================
       TABLET
    ================================================== */

    @media (max-width: 1000px) {

      .site-header {
        padding: 0 22px;
      }

      .nav-left {
        gap: 26px;
      }

      .nav-center {
        gap: 26px;
      }

      .menu-link {
        font-size: 12px;
      }

      .name {
        font-size: 12px;
      }


      .homepage {
        grid-template-columns: 58% 42%;

        gap: 28px;

        padding:
          20px
          24px
          30px;
      }


      .photo-area {
        height: calc(100vh - 130px);
      }


      .projects {
        height: calc(100vh - 140px);

        gap: 30px;
      }


      .project-link {
        font-size: clamp(22px, 3vw, 32px);
      }

    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 650px) {

      .site-header {
        height: auto;

        display: flex;
        flex-wrap: wrap;

        padding: 20px;

        gap: 16px;
      }


      .nav-left {
        gap: 20px;
      }


      .nav-center {
        margin-left: auto;

        gap: 20px;
      }


      .identity {
        width: 100%;

        justify-content: flex-end;
      }


      .homepage {
        display: block;

        min-height: auto;

        padding:
          25px
          20px
          45px;
      }


      .photo-area {
        width: 100%;
        height: auto;

        margin-bottom: 35px;
      }


      .photo-area img {
        width: 100%;

        max-width: 100%;
        max-height: none;
      }


      .projects {
        width: 100%;
        height: 380px;

        justify-content: center;

        gap: 28px;
      }


      .project-link {
        height: 100%;

        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
  ================================================== -->

  <header class="site-header">


    <nav class="nav-left">

      <a
        class="menu-link"
        href="./"
      >
        Home
      </a>


      <a
        class="menu-link"
        href="#projects"
      >
        Projects
      </a>

    </nav>



    <nav class="nav-center">

      <a
        class="menu-link"
        href="#"
      >
        Selected
      </a>


      <a
        class="menu-link"
        href="#"
      >
        About
      </a>

    </nav>



    <div class="identity">

      <span class="name">
        Arianna Quattropani
      </span>


      <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
          ></rect>

          <circle
            cx="12"
            cy="12"
            r="4"
          ></circle>

          <circle
            cx="17.5"
            cy="6.5"
            r=".7"
            fill="#000"
            stroke="none"
          ></circle>

        </svg>

      </a>

    </div>


  </header>



  <!-- ==================================================
       HOMEPAGE
  ================================================== -->

  <main class="homepage">


    <!-- PHOTO LEFT -->

    <section class="photo-area">

      <img
        src="assets/home-01.jpg"
        alt="Photography by Arianna Quattropani"
        onerror="this.style.display='none'"
      >

    </section>



    <!-- PROJECTS RIGHT -->

    <nav
      class="projects"
      id="projects"
      aria-label="Projects"
    >


      <a
        class="project-link"
        href="project/residual-green/"
      >
        Residual Green
      </a>


      <a
        class="project-link"
        href="project/faraway-so-close/"
      >
        Faraway So Close
      </a>


      <a
        class="project-link"
        href="project/aremu/"
      >
        Aremu
      </a>


    </nav>


  </main>


</body>

</html>
