<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arianna Quattropani</title>

  <meta
    name="description"
    content="Photographic works by Arianna Quattropani. Projects, exhibitions and publications."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    .site-header {
      width: 100%;
      height: 82px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      padding: 0 3vw;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .nav-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 54px;
    }

    .identity {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
    }

    .menu-link {
      position: relative;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    .menu-link::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 1px;
      width: 0;
      height: 1px;
      background: #000;
      transform: translateX(-50%);
      transition: width 0.18s ease;
    }

    .menu-link:hover::after {
      width: 23px;
    }

    .name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.015em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .instagram {
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instagram svg {
      width: 17px;
      height: 17px;
      stroke: #000;
    }

    /* MAIN */

    .homepage {
      min-height: calc(100vh - 82px);
      display: grid;
      grid-template-columns: minmax(0, 63%) minmax(260px, 37%);
      gap: 5vw;
      align-items: center;
      padding: 4vh 4vw 6vh;
    }

    /* PHOTO LEFT */

    .photo-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .photo-area img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 68vh;
      object-fit: contain;
      filter: grayscale(100%);
    }

    /* VERTICAL PROJECT TITLES RIGHT */

    .projects {
      height: 58vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(42px, 5vw, 88px);
    }

    .project-link {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      writing-mode: vertical-rl;

      font-size: clamp(22px, 2.15vw, 35px);
      font-weight: 300;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      white-space: nowrap;

      transition: opacity 0.18s ease;
    }

    .project-link:hover {
      opacity: 0.42;
    }

    /* TABLET */

    @media (max-width: 950px) {
      .site-header {
        padding: 0 22px;
      }

      .nav-left {
        gap: 25px;
      }

      .nav-center {
        gap: 25px;
      }

      .menu-link {
        font-size: 12px;
      }

      .name {
        font-size: 12px;
      }

      .homepage {
        grid-template-columns: 60% 40%;
        padding: 35px 25px 45px;
        gap: 30px;
      }

      .projects {
        gap: 28px;
      }
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .site-header {
        height: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 20px;
      }

      .nav-left {
        gap: 20px;
      }

      .nav-center {
        margin-left: auto;
        gap: 20px;
      }

      .identity {
        width: 100%;
        justify-content: flex-end;
      }

      .homepage {
        display: block;
        padding: 35px 20px 50px;
      }

      .photo-area {
        margin-bottom: 40px;
      }

      .photo-area img {
        width: 100%;
        max-height: none;
      }

      .projects {
        height: 300px;
        justify-content: center;
        gap: 28px;
      }

      .project-link {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <nav class="nav-left">
      <a class="menu-link" href="./">Home</a>
      <a class="menu-link" href="#projects">Projects</a>
    </nav>

    <nav class="nav-center">
      <a class="menu-link" href="#">Selected</a>
      <a class="menu-link" href="#">About</a>
    </nav>

    <div class="identity">

      <span class="name">
        Arianna Quattropani
      </span>

      <a
        class="instagram"
        href="#"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r=".7" fill="#000" stroke="none"></circle>
        </svg>
      </a>

    </div>

  </header>

  <main class="homepage">

    <section class="photo-area">
      <img
        src="assets/home-01.jpg"
        alt="Photography by Arianna Quattropani"
        onerror="this.style.display='none'"
      >
    </section>

    <nav class="projects" id="projects">

      <a
        class="project-link"
        href="project/residual-green/"
      >
        Residual Green
      </a>

      <a
        class="project-link"
        href="project/faraway-so-close/"
      >
        Faraway So Close
      </a>

      <a
        class="project-link"
        href="project/aremu/"
      >
        Aremu
      </a>

    </nav>

  </main>

</body>
</html>
