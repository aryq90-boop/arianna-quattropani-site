<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arianna Quattropani</title>
  <meta name="description" content="Photographic works by Arianna Quattropani. Projects, exhibitions and publications." />
  <meta name="author" content="Arianna Quattropani" />
  <link rel="stylesheet" href="assets/home-kelly.css" />
</head>
<body>
  <header class="site-header">
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-link is-active" href="./">Home</a>
      <a class="nav-link" href="#selected">Selected</a>
      <a class="nav-link" href="#about">About</a>
    </nav>

    <div class="identity">
      <a class="brand" href="./">Arianna Quattropani</a>
      <a class="instagram" href="#" aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.3" y="3.3" width="17.4" height="17.4" rx="5"></rect>
          <circle cx="12" cy="12" r="4.1"></circle>
          <circle cx="17.45" cy="6.75" r="0.9" class="dot"></circle>
        </svg>
      </a>
    </div>
  </header>

  <main class="home-main">
    <section class="project-list" aria-label="Projects">
      <a class="project-link is-current"
         href="project/residual-green/"
         data-project="residual-green">
        Residual Green
      </a>
      <a class="project-link"
         href="project/faraway-so-close/"
         data-project="faraway-so-close">
        Faraway So Close
      </a>
      <a class="project-link"
         href="project/aremu/"
         data-project="aremu">
        Aremu
      </a>
    </section>

    <section class="preview" aria-label="Project preview">
      <figure class="slide is-active" data-project="residual-green">
        <img src="assets/home-residual-green.jpg" alt="Residual Green by Arianna Quattropani" />
        <figcaption>Residual Green</figcaption>
      </figure>

      <figure class="slide" data-project="faraway-so-close">
        <img src="assets/home-faraway-so-close.jpg" alt="Faraway So Close by Arianna Quattropani" />
        <figcaption>Faraway So Close</figcaption>
      </figure>

      <figure class="slide" data-project="aremu">
        <img src="assets/home-aremu.jpg" alt="Aremu by Arianna Quattropani" />
        <figcaption>Aremu</figcaption>
      </figure>
    </section>
  </main>

  <script src="assets/home-kelly.js"></script>
</body>
</html>
